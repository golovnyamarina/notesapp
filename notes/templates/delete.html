<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить заметку</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .actions { margin-top: 20px; }
        .btn { padding: 8px 15px; text-decoration: none; border-radius: 4px; color: white; border: none; cursor: pointer; }
        .btn-confirm { background-color: #dc3545; }
        .btn-cancel { background-color: #6c757d; margin-left: 10px; }
    </style>
</head>
<body>

    <h1>Удаление заметки</h1>
    
    <p>Вы действительно хотите удалить заметку <strong>«{{ note.title }}»</strong>? Это действие нельзя будет отменить.</p>

    <form method="post" class="actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-confirm">Да, удалить</button>
        <a href="{% url 'note_list' %}" class="btn btn-cancel">Отмена</a>
    </form>

</body>
</html>
